# plshare2 — 로컬 원커맨드 실행
#
#   (A) 빠른 데모:   docker compose up --build
#       백엔드(:8080, demo=H2 인메모리+Mock) + 프론트엔드(:3000). 외부 자격증명/DB 불필요.
#
#   (B) Postgres + 마이그레이션 검증:
#       docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#       번들 PostgreSQL + 실제 Flyway 마이그레이션(V1..) + ddl-auto=validate. 외부 어댑터는
#       여전히 Mock(demo,postgres 프로파일)이라 자격증명 불필요. 데이터는 named volume에 영속.
#
# 브라우저로 http://localhost:3000 접속.
# 끄기:   docker compose down   (Postgres 데이터까지 삭제: ... down -v)
#
# ※ 실제 외부 어댑터(prod)는 자격증명이 필요하다. application-prod.yml 참고 +
#   SPRING_PROFILES_ACTIVE=prod + .env 의 SPOTIFY/GOOGLE 키를 채워야 한다.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # demo = H2 인메모리 + Mock 어댑터. 자격증명 없이 즉시 동작.
      SPRING_PROFILES_ACTIVE: demo
    ports:
      - "8080:8080"
    healthcheck:
      # temurin 이미지는 bash 포함. /dev/tcp 로 포트 오픈 여부만 확인(추가 툴 불필요).
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 브라우저에서 호출하는 주소(빌드 시 번들에 인라인됨). 호스트에 게시된 8080 포트.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    environment:
      # 프론트엔드 컨테이너 내부(SSR/route handler)에서 백엔드를 부를 때 쓰는 주소.
      API_BASE_INTERNAL_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

# ──────────────────────────────────────────────────────────────────────────
# PostgreSQL + 실제 마이그레이션으로 띄우려면 → docker-compose.postgres.yml 오버레이 사용:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
# (postgres 서비스 + backend 의 demo,postgres 프로파일 + DATABASE_URL 을 그 파일이 추가한다)
# ──────────────────────────────────────────────────────────────────────────
