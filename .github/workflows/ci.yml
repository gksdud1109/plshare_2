name: CI

# ⚠️ 비활성화됨 (2026-06-06) — 실제 인프라/CI 준비 전까지 자동 실행 중단.
# 자동 push/PR 트리거를 끄고 수동 실행(workflow_dispatch)만 남김 → 실패 메일 발생 안 함.
# 다시 켜려면: 아래 workflow_dispatch 를 지우고 주석 처리된 pull_request/push 블록을 복원.
on:
  workflow_dispatch:
#  pull_request:
#    branches: [main]
#  push:
#    branches: [main]

jobs:
  backend:
    name: Backend (Gradle test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('backend/**/*.gradle*') }}
      - name: Run tests
        working-directory: backend
        run: ./gradlew test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  frontend:
    name: Frontend (lint + tsc + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (BE demo + FE prod + Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: ./gradlew bootJar -x test
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Start backend (demo)
        working-directory: backend
        run: |
          nohup java -jar build/libs/*.jar --spring.profiles.active=demo > /tmp/be.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api/playlists > /dev/null; then
              echo "BE ready"
              exit 0
            fi
            sleep 2
          done
          echo "BE failed to start"
          tail -50 /tmp/be.log
          exit 1
      - name: Start frontend (prod)
        working-directory: frontend
        run: |
          nohup npm run start > /tmp/fe.log 2>&1 &
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "FE ready"
              exit 0
            fi
            sleep 2
          done
          echo "FE failed to start"
          tail -50 /tmp/fe.log
          exit 1
      - name: Run Playwright E2E
        working-directory: frontend
        run: node e2e/demo-flow.spec.mjs
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: frontend/e2e/screenshots/
      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            /tmp/be.log
            /tmp/fe.log
