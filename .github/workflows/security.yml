name: Security

# ⚠️ 비활성화됨 (2026-06-06) — gitleaks 시크릿 스캔 자동 실행 중단.
# 다시 켜려면: 아래 workflow_dispatch 를 지우고 주석 처리된 pull_request/push 블록을 복원.
on:
  workflow_dispatch:
#  pull_request:
#  push:
#    branches: [main]

jobs:
  secret-scan:
    name: Secret leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
