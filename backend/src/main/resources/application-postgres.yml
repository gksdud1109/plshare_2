# Postgres-backed local profile. Use it TOGETHER with the demo profile so the
# external adapters stay mocked (no real credentials needed):
#
#   SPRING_PROFILES_ACTIVE=demo,postgres
#
# `demo,postgres` keeps demo's Mock Spotify/Apple/Google/YouTube beans and the
# demo data seeder, but overrides only the datasource: PostgreSQL with Flyway and
# ddl-auto=validate. This is the first profile that actually runs the migration
# chain (V1..) and validates entities against it — drift the H2 demo profile
# (entities create the schema) can never catch.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/plshare}
    username: ${DATABASE_USERNAME:plshare}
    password: ${DATABASE_PASSWORD:plshare}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
