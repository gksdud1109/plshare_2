spring:
  datasource:
    url: jdbc:h2:mem:plshare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false

spotify:
  client-id: demo-client
  client-secret: demo-secret

apple:
  team-id: demo-team
  key-id: demo-key

apple-music:
  team-id: ""
  key-id: ""
  private-key-pem: ""
  storefront: us

storage:
  bucket: demo-local
  public-base-url: http://localhost:8080/api/_demo/files

logging:
  level:
    com.plshare: DEBUG
    org.hibernate.SQL: INFO
