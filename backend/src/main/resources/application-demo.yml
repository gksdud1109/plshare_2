spring:
  datasource:
    url: jdbc:h2:mem:plshare;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

spotify:
  client-id: demo-client
  client-secret: demo-secret

apple:
  team-id: demo-team
  key-id: demo-key

logging:
  level:
    com.plshare: DEBUG
    org.hibernate.SQL: INFO
